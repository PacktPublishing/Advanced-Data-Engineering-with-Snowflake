name: chapter7-snowpark

on:
  workflow_dispatch:
  push:
    paths:
      - "chapters/chapter7/**"
  pull_request:
    paths:
      - "chapters/chapter7/**"

jobs:
  unit:
    name: Local Snowpark unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chapters/chapter7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests (in-memory Snowpark)
        run: pytest -q tests/unit

  integration:
    name: Warehouse-backed integration tests
    runs-on: ubuntu-latest
    needs: unit
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: chapters/chapter7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Stage Snowflake config
        env:
          SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SF_USER: ${{ secrets.SF_USER }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml <<'TOML'
          default_connection_name = "ci_default"

          [connections.ci_default]
          account = "${SF_ACCOUNT}"
          user = "${SF_USER}"
          password = "${SF_PASSWORD}"
          role = "SNOWPARK_CI"
          warehouse = "BOOK_WH_XS"
          database = "GOLD_DB"
          schema = "PUBLIC"
          TOML
          chmod 600 ~/.snowflake/config.toml
      - name: Run integration tests
        env:
          SNOWFLAKE_CONNECTION_NAME: ci_default
        run: pytest -q tests/integration
